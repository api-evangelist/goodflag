- breaking: false
  highlights:
  - Le motif de signature ne prend pas en compte l'attribut country du certificat (LE-1838)
  - Ce comportement est corrigé. L'anomalie concernait uniquement la version 1.21.3.
  date: '2026-09-29'
- breaking: false
  highlights:
  - L'obligation de disposition de métadonnées persiste après un rafraîchissement à la création d'un parapheur (LE-1458)
  - 'Après un rafraîchissement de la page de création d''un parapheur collaboratif, l''obligation de disposition de métadonnées définie par le
    groupe d''utilisateurs n''était plus appliquée : la sélection devenait optionnelle, les champs de métadonnées disparaissaient et le parapheur
    pouvait être enregistré sans disposition ni métadonnées obligatoires. Ce comportement est corrigé.'
  - L'option « Cacher les pièces jointes » s'applique aux signataires de type contact (LE-1470)
  - 'Lorsque l''option « Cacher les pièces jointes » était cochée sur une étape, les pièces jointes restaient visibles pour les signataires de
    type contact, alors qu''elles étaient bien masquées pour les signataires de type utilisateur. Ce comportement est corrigé : l''option s''applique
    désormais de manière identique quel que soit le type de destinataire.'
  date: '2026-09-15'
